defaults:
  compress: gzip
  timestamp_format: "20060102-150405"
  concurrency: 1
  work_dir: "./backups"
  manifest_path: "./backups/manifest.jsonl"

report:
  enabled: false
  url: "http://127.0.0.1:8080/api/backup/events"
  token: "${BACKUP_CENTER_TOKEN}"
  timeout: "5s"
  retry:
    attempts: 3
    backoff: "1s"
  headers:
    X-Project: "game-server"

identity:
  project: "game-server"
  cluster: "local"
  machine_id: "${COMPUTERNAME}"

retention:
  keep_last: 7
  keep_days: 14

sources:
  - name: "mysql-game"
    type: mysql
    mysql:
      host: "127.0.0.1"
      port: 3306
      user: "backup"
      password: "${MYSQL_BACKUP_PASSWORD}"
      database: "game"
      version: "mysql80" # enum: mysql57, mysql80
      dump_tool: "mysqldump"
      restore_tool: "mysql"
      mode: "mysqldump"
      single_transaction: true
      quick: true
      routines: true
      triggers: true
      events: true
      set_gtid_purged: "OFF"
      no_create_db: false

  - name: "mysql-game-full"
    type: mysql
    mysql:
      host: "127.0.0.1"
      port: 3306
      user: "backup"
      password: "${MYSQL_BACKUP_PASSWORD}"
      database: "game"
      version: "mysql80"
      mode: "full"
      physical_engine: "xtrabackup"
      physical_artifact_format: "zip" # zip or tar.gz
      xtrabackup_tool: "xtrabackup"
      xtrabackup_dir: "./backups/xtrabackup"
      xtrabackup_restore_dir: "./restore/mysql-xtrabackup"
      # Optional one-key physical restore. Leave restore_datadir empty to only prepare.
      restore_datadir: ""
      restore_stop_command: []
      restore_start_command: []
      restore_fix_ownership_command: []

  - name: "mysql-game-incremental"
    type: mysql
    mysql:
      host: "127.0.0.1"
      port: 3306
      user: "backup"
      password: "${MYSQL_BACKUP_PASSWORD}"
      database: "game"
      version: "mysql80"
      mode: "incremental"
      physical_engine: "xtrabackup"
      physical_artifact_format: "zip" # zip or tar.gz
      xtrabackup_tool: "xtrabackup"
      xtrabackup_dir: "./backups/xtrabackup"
      # Optional. If empty, dbbackup233 uses xtrabackup_dir/latest-base.txt.
      incremental_base_dir: ""
      xtrabackup_restore_dir: "./restore/mysql-xtrabackup"
      restore_datadir: ""
      restore_stop_command: []
      restore_start_command: []
      restore_fix_ownership_command: []

  - name: "postgres-analytics"
    type: postgres
    postgres:
      host: "127.0.0.1"
      port: 5432
      user: "backup"
      password: "${PG_BACKUP_PASSWORD}"
      database: "analytics"
      dump_tool: "pg_dump"
      restore_tool: "pg_restore"
      mode: "pg_dump"
      format: "custom"
      jobs: 1

  - name: "server-files"
    type: file
    file:
      paths: ["./data", "./logs"]
      restore_dir: "./restore/files"

  - name: "any-custom-system"
    type: command
    command:
      extension: "tar.gz"
      # ARTIFACT_PATH is injected as env var and template value.
      backup_command: ["sh", "-lc", "tar -czf \"$ARTIFACT_PATH\" ./anything"]
      restore_command: ["sh", "-lc", "mkdir -p ./restore/anything && tar -xzf \"$ARTIFACT_PATH\" -C ./restore/anything"]
      capture_stdout: false
      restore_stdin: false

  - name: "redis-cache"
    type: redis
    redis:
      host: "127.0.0.1"
      port: 6379
      password: "${REDIS_PASSWORD}"
      mode: "bgsave"
      cli_path: "redis-cli"
      rdb_path: "/var/lib/redis/dump.rdb"
      restore_path: "./restore/redis/dump.rdb"

  - name: "elasticsearch-logs"
    type: elasticsearch
    elasticsearch:
      url: "http://127.0.0.1:9200"
      username: "${ES_USERNAME}"
      password: "${ES_PASSWORD}"
      repository: "game-backups"
      snapshot: "dbbackup233-game-logs"
      mode: "snapshot"
      indices: ["game-*"]
      include_global_state: false

  - name: "clickhouse-events"
    type: clickhouse
    clickhouse:
      host: "127.0.0.1"
      port: 9000
      user: "backup"
      password: "${CLICKHOUSE_PASSWORD}"
      database: "game_events"
      mode: "full"
      backup_name: "game-events-full"
      backup_destination: "Disk('backups', 'game-events-full.zip')"
      client_tool: "clickhouse-client"

targets:
  - name: "local"
    type: local
    local:
      path: "./backups"

jobs:
  - name: "mysql-game"
    source: "mysql-game"
    targets: ["local"]

  - name: "mysql-game-full"
    source: "mysql-game-full"
    targets: ["local"]

  - name: "mysql-game-incremental"
    source: "mysql-game-incremental"
    targets: ["local"]

  - name: "postgres-analytics"
    source: "postgres-analytics"
    targets: ["local"]

  - name: "server-files"
    source: "server-files"
    targets: ["local"]

  - name: "any-custom-system"
    source: "any-custom-system"
    targets: ["local"]

  - name: "redis-cache"
    source: "redis-cache"
    targets: ["local"]

  - name: "elasticsearch-logs"
    source: "elasticsearch-logs"
    targets: ["local"]

  - name: "clickhouse-events"
    source: "clickhouse-events"
    targets: ["local"]
